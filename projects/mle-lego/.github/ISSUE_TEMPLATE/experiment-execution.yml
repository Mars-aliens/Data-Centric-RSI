name: 技术一实验执行
description: 分配一次可复现的技术一服务器运行
title: "实验："
labels:
  - experiment
body:
  - type: markdown
    attributes:
      value: |
        分配 Issue 前填写全部执行字段。贡献者必须运行记录的 commit，并返回可审计证据包。
  - type: input
    id: objective
    attributes:
      label: 实验目的
      description: 本次执行哪个研究比较或验证？
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Git commit 或 tag
      description: 必须执行的精确源码版本。
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: 私有 profile 版本或哈希
      description: Profile 不上传 GitHub；在这里记录可识别的版本或哈希。
    validations:
      required: true
  - type: input
    id: data
    attributes:
      label: 数据清单和 SHA256
      description: 记录数据来源版本、切分清单和校验和。
    validations:
      required: true
  - type: input
    id: models
    attributes:
      label: 模型版本
      description: 记录 Task Model 和 Decision LLM 的 ID 与 revision。
    validations:
      required: true
  - type: input
    id: execution
    attributes:
      label: 执行参数
      description: 记录模式、seed、batch、预算、GPU 和输出根。
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: 必须通过的门槛
      options:
        - label: 正式运行前必须完成 smoke test。
          required: true
        - label: `final_test` 必须保持锁定。
          required: true
        - label: 结果必须使用新的输出根。
          required: true
        - label: 数据集和模型权重不得提交。
          required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成条件
      description: 列出所需摘要、审计命令和证据位置。
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: 贡献者报告
      description: 执行后按 docs/contributor-execution-runbook.md 填写。
      render: text
